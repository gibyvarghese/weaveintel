# Release — publishes the @weaveintel/* libraries to npm via Changesets.
#
# HOW IT WORKS
#   • Contributors add a changeset in their PR (`npx changeset`); see .changeset/README.md.
#   • On push to main, the Changesets action either:
#       (a) opens/updates a "Version Packages" PR (applies pending changesets, bumps versions,
#           writes CHANGELOGs) when changesets are pending, or
#       (b) publishes the freshly-bumped packages to npm when that PR is merged (no changesets left).
#   • Each published package is versioned INDEPENDENTLY (SemVer). See VERSIONING.md.
#
# AUTH — npm Trusted Publishing (OIDC), no long-lived token
#   Every @weaveintel/* package trusts GitHub Actions: repository gibyvarghese/weaveintel, workflow
#   release.yml, no environment (set up on npmjs.com, 22 Nov 2026). At publish time npm mints a
#   short-lived token from this workflow's OIDC identity (`id-token: write`), and the same identity
#   signs the provenance attestation. There is no NPM_TOKEN secret any more.
#   A package added later needs its own Trusted Publisher entry before its first CI publish:
#     npm trust github @weaveintel/<pkg> --repo gibyvarghese/weaveintel --file release.yml --allow-publish
#   Requires Node ≥22 / npm ≥11.5.1.

name: Release

on:
  push:
    branches:
      - main

# Least privilege at the top; the job widens only what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags/commits + the Version Packages PR branch
      pull-requests: write # open/update the Version Packages PR
      id-token: write # OIDC → npm Trusted Publishing + provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Changesets needs full history to compute what changed

      - uses: actions/setup-node@v7
        with:
          node-version: 22 # Trusted Publishing needs Node ≥22 / npm ≥11.5.1
          registry-url: https://registry.npmjs.org

      # Ensure npm is new enough for OIDC Trusted Publishing.
      - name: Upgrade npm
        run: npm install -g npm@11 # 11.5.1+ has OIDC; npm 12 needs a newer Node 22 than setup-node may give

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create Release PR or publish to npm
        uses: changesets/action@v1
        with:
          version: npm run ci:version # applies changesets (opens the Version Packages PR)
          publish: npm run ci:publish # publishes when there are no pending changesets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true" # attach provenance attestation on publish
